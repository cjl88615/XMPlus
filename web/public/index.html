<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f8f5">
  <meta name="description" content="塔岛听书 · 发现、收听和收藏喜欢的有声内容">
  <title>塔岛听书</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.6 4.6"/></symbol>
    <symbol id="ic-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10Z"/><path d="M9 21v-7h6v7"/></symbol>
    <symbol id="ic-headphones" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v7H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 1-2Zm16 0h-3v7h2a2 2 0 0 0 2-2v-3a2 2 0 0 0-1-2Z"/></symbol>
    <symbol id="ic-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></symbol>
    <symbol id="ic-heart" viewBox="0 0 24 24"><path d="M20.5 5.5a5.3 5.3 0 0 0-7.5 0L12 6.6l-1.1-1.1a5.3 5.3 0 0 0-7.5 7.5L12 21l8.5-8a5.3 5.3 0 0 0 0-7.5Z"/></symbol>
    <symbol id="ic-library" viewBox="0 0 24 24"><path d="M4 3v18M9 3v18M14 3v18m4-17 3 16"/><path d="M3 21h18"/></symbol>
    <symbol id="ic-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15.2a1.8 1.8 0 0 0 .3 2l-2.5 2.5a1.8 1.8 0 0 0-2-.3 1.8 1.8 0 0 0-1.1 1.6h-3.5a1.8 1.8 0 0 0-1.1-1.6 1.8 1.8 0 0 0-2 .3L5 17.2a1.8 1.8 0 0 0 .3-2A1.8 1.8 0 0 0 3.7 14v-3.5a1.8 1.8 0 0 0 1.6-1.1 1.8 1.8 0 0 0-.3-2L7.5 5a1.8 1.8 0 0 0 2 .3 1.8 1.8 0 0 0 1.1-1.6h3.5a1.8 1.8 0 0 0 1.1 1.6 1.8 1.8 0 0 0 2-.3l2.5 2.5a1.8 1.8 0 0 0-.3 2 1.8 1.8 0 0 0 1.6 1.1V14a1.8 1.8 0 0 0-1.6 1.2Z"/></symbol>
    <symbol id="ic-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7V5Z"/></symbol>
    <symbol id="ic-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="ic-next" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7V5Zm13 0v14"/></symbol>
    <symbol id="ic-prev" viewBox="0 0 24 24"><path d="m19 5-10 7 10 7V5ZM6 5v14"/></symbol>
    <symbol id="ic-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="ic-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="ic-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    <symbol id="ic-moon" viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></symbol>
    <symbol id="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.5 1.5m11.2 11.2 1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/></symbol>
    <symbol id="ic-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="ic-volume" viewBox="0 0 24 24"><path d="M3 9h4l5-5v16l-5-5H3V9Zm13-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="ic-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6h2M3 12h2M3 18h2"/></symbol>
    <symbol id="ic-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M20 8V3l-4 4a8 8 0 1 0 3 7M20 3h-5"/></symbol>
    <symbol id="ic-external" viewBox="0 0 24 24"><path d="M13 4h7v7m0-7-9 9M19 14v5H5V5h5"/></symbol>
    <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
  </svg>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/" aria-label="塔岛听书首页">
        <img src="/favicon.svg" alt="" class="brand-mark">
        <span class="brand-name">塔岛听书</span>
      </a>
      <div class="side-label">浏览</div>
      <nav class="side-nav" aria-label="主菜单">
        <button class="side-link active" data-view="explore"><svg class="icon"><use href="#ic-home"/></svg><span>发现</span></button>
        <button class="side-link" data-view="history"><svg class="icon"><use href="#ic-headphones"/></svg><span>听过</span></button>
        <button class="side-link" data-view="favorites"><svg class="icon"><use href="#ic-heart"/></svg><span>我的收藏</span></button>
        <button class="side-link" data-view="subscriptions"><svg class="icon"><use href="#ic-library"/></svg><span>我的订阅</span></button>
        <button class="side-link" data-view="downloads"><svg class="icon"><use href="#ic-download"/></svg><span>下载</span></button>
      </nav>
      <div class="side-bottom">
        <button class="side-link" data-view="settings"><svg class="icon"><use href="#ic-settings"/></svg><span>设置</span></button>
        <div class="sidebar-note">塔岛听书 <span class="side-separator">·</span> 1.2.1</div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menu-btn" class="icon-button mobile-menu" aria-label="打开菜单"><svg class="icon"><use href="#ic-menu"/></svg></button>
          <div class="search-wrap">
            <svg class="icon search-leading"><use href="#ic-search"/></svg>
            <form id="search-form" role="search"><label class="sr-only" for="search-input">搜索声音和专辑</label><input id="search-input" type="search" placeholder="搜索声音、专辑、主播" autocomplete="off" maxlength="100"></form>
            <kbd class="search-hint">Enter</kbd>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-button theme-button" data-action="theme" aria-label="切换深色模式"><svg class="icon"><use href="#ic-moon"/></svg></button>
          <button id="account-btn" class="account-button" data-action="account"><span class="account-avatar"><svg class="icon"><use href="#ic-user"/></svg></span><span id="account-label">登录</span></button>
        </div>
      </header>
      <main id="content" class="content" tabindex="-1">
        <div class="loading-state"><span class="spinner"></span><span>加载中…</span></div>
      </main>
    </div>
  </div>
  <div id="player" class="player" hidden>
    <img id="player-cover" class="player-cover" src="/favicon.svg" alt="">
    <div class="playing-info"><div id="player-title" class="playing-title"></div><div id="player-subtitle" class="playing-subtitle"></div></div>
    <div class="player-main">
      <div class="play-controls">
        <button class="icon-button" data-action="prev" aria-label="上一首"><svg class="icon"><use href="#ic-prev"/></svg></button>
        <button class="play-toggle" data-action="toggle" aria-label="播放或暂停"><svg class="icon"><use href="#ic-play"/></svg></button>
        <button class="icon-button" data-action="next" aria-label="下一首"><svg class="icon"><use href="#ic-next"/></svg></button>
      </div>
      <div class="progress-line">
        <span id="time-current">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="播放进度"><span id="time-duration">0:00</span>
      </div>
    </div>
    <div class="player-extra">
      <label class="speed-select"><span class="sr-only">播放速度</span><select id="speed" aria-label="播放速度"><option value="0.75">0.75×</option><option value="1" selected>1.0×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2.0×</option></select></label>
      <div class="volume"><svg class="icon"><use href="#ic-volume"/></svg><input type="range" id="volume" min="0" max="100" value="80" aria-label="音量"></div>
      <button class="icon-button" data-action="queue" aria-label="播放队列"><svg class="icon"><use href="#ic-list"/></svg></button>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </div>
  <nav class="mobile-nav" aria-label="移动端导航">
    <button data-view="explore" class="mobile-link active"><svg class="icon"><use href="#ic-home"/></svg><span>发现</span></button>
    <button data-view="history" class="mobile-link"><svg class="icon"><use href="#ic-headphones"/></svg><span>听过</span></button>
    <button data-view="favorites" class="mobile-link"><svg class="icon"><use href="#ic-heart"/></svg><span>收藏</span></button>
    <button data-view="downloads" class="mobile-link"><svg class="icon"><use href="#ic-download"/></svg><span>下载</span></button>
    <button data-view="settings" class="mobile-link"><svg class="icon"><use href="#ic-settings"/></svg><span>设置</span></button>
  </nav>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
